name: Tool einreichen
description: Schlage ein neues Tool für die HSBI-Tools-Sammlung vor.
title: "[Tool] Name des Tools"
labels: ["tool-submission"]
body:
  - type: markdown
    attributes:
      value: |
        ## Tool einreichen
        Fülle das Formular aus, um ein neues Tool vorzuschlagen. Der PR wird automatisch erstellt.

  - type: markdown
    attributes:
      value: "### Allgemeine Informationen"

  - type: input
    id: url
    attributes:
      label: URL
      placeholder: https://...
    validations:
      required: true

  - type: input
    id: author
    attributes:
      label: Autor / Autorin
      placeholder: z.B. "Alex T."
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Beschreibung
      description: Kurze Beschreibung, was das Tool macht.
      placeholder: Dieses Tool...
    validations:
      required: true

  - type: markdown
    attributes:
      value: "### Einordnung"

  - type: dropdown
    id: audience
    attributes:
      label: Zielgruppe
      options:
        - Student*innen
        - Mitarbeiter*innen
        - Beide
    validations:
      required: true

  - type: input
    id: tags
    attributes:
      label: Kategorien
      description: Kommagetrennte Liste, kann auch leer bleiben.
      placeholder: "typografie, layout, ki"

  - type: dropdown
    id: internal
    attributes:
      label: Nur im HSBI-Netz erreichbar?
      description: Ist das Tool nur im internen HSBI-Netz oder per VPN erreichbar?
      options:
        - "Nein"
        - "Ja"
    validations:
      required: true
