name: Tool Submission → PR

on:
  issues:
    types: [opened, edited]

jobs:
  create-pr:
    if: contains(github.event.issue.labels.*.name, 'tool-submission')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Parse issue form fields
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body ?? '';

            function field(label) {
              // Matches "### Label\n\nValue" from GitHub issue form output
              const re = new RegExp(`### ${label}\\s+([\\s\\S]*?)(?=\\n###|$)`);
              const m = body.match(re);
              return m ? m[1].trim() : '';
            }

            // Title comes from the issue title, not a separate body field
            const title       = context.payload.issue.title.replace(/^\[Tool\]\s*/, '').trim();
            const url         = field('URL');
            const description = field('Beschreibung');
            const author      = field('Autor \\/ Autorin');
            const tagsRaw     = field('Kategorien');

            // Map German audience labels to schema values
            const audienceRaw = field('Zielgruppe');
            const audienceMap = {
              'Student*innen':     'students',
              'Mitarbeiter*innen': 'staff',
              'Beide':             'both',
            };
            const audience = audienceMap[audienceRaw] ?? 'both';

            // Map Ja/Nein to boolean
            const internalRaw = field('Nur im HSBI-Netz erreichbar\\?');
            const internal = internalRaw === 'Ja' ? 'true' : 'false';

            const tags = tagsRaw
              ? tagsRaw.split(',').map(t => `"${t.trim()}"`).join(', ')
              : '';
            const today = new Date().toISOString().split('T')[0];

            // Build a safe filename from the title
            const slug = title
              .toLowerCase()
              .replace(/[^a-z0-9]+/g, '-')
              .replace(/^-|-$/g, '');

            const frontmatter = [
              '---',
              `title: "${title}"`,
              `url: "${url}"`,
              `description: "${description.replace(/"/g, '\\"')}"`,
              `author: "${author}"`,
              `status: "wip"`,
              `tags: [${tags}]`,
              `audience: "${audience}"`,
              `internal: ${internal}`,
              `addedAt: "${today}"`,
              '---',
              '',
            ].join('\n');

            core.setOutput('slug', slug);
            core.setOutput('frontmatter', frontmatter);
            core.setOutput('branch', `tool-submission/${slug}-${context.payload.issue.number}`);

      - name: Create branch and file
        env:
          SLUG: ${{ steps.parse.outputs.slug }}
          BRANCH: ${{ steps.parse.outputs.branch }}
          FRONTMATTER: ${{ steps.parse.outputs.frontmatter }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          printf '%s' "$FRONTMATTER" > "src/content/tools/${SLUG}.md"
          git add "src/content/tools/${SLUG}.md"
          git commit -m "feat: add tool submission '${SLUG}' (issue #${{ github.event.issue.number }})"
          git push --force origin "$BRANCH"

      - name: Open pull request
        uses: actions/github-script@v7
        with:
          script: |
            const issue   = context.payload.issue;
            const branch  = '${{ steps.parse.outputs.branch }}';

            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `[Tool] ${issue.title.replace(/^\[Tool\]\s*/, '')}`,
              head:  branch,
              base:  'main',
              body:  `Automatisch generierter PR aus Issue #${issue.number}.\n\nBitte Inhalt prüfen, dann mergen.\n\nCloses #${issue.number}`,
              draft: true,
            });

            await github.rest.issues.createComment({
              owner:      context.repo.owner,
              repo:       context.repo.repo,
              issue_number: issue.number,
              body: `Danke! Ein Draft-PR wurde automatisch erstellt: ${pr.html_url}\n\nEin Admin wird ihn prüfen und mergen.`,
            });
