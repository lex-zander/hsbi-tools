name: Tool Submission → PR

on:
  issues:
    types: [opened, edited]

concurrency:
  group: tool-submission-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  create-pr:
    if: >-
      contains(github.event.issue.labels.*.name, 'tool-submission') &&
      github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Parse issue form fields
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            // GitHub delivers issue bodies with CRLF line endings.
            const body = (context.payload.issue.body ?? '').replace(/\r\n/g, '\n');

            function field(label) {
              // Matches "### Label\n\nValue" from GitHub issue form output
              const re = new RegExp(`### ${label}\\s+([\\s\\S]*?)(?=\\n###|$)`);
              const m = body.match(re);
              const value = m ? m[1].trim() : '';
              // Optional fields left blank are rendered as this placeholder.
              return value === '_No response_' ? '' : value;
            }

            // JSON strings are valid YAML double-quoted scalars, so this handles
            // quotes, backslashes and multi-line descriptions in one go.
            const yaml = (value) => JSON.stringify(String(value));

            // Title comes from the issue title, not a separate body field
            const title       = context.payload.issue.title.replace(/^\[Tool\]\s*/, '').trim();
            const url         = field('URL');
            const description = field('Beschreibung');
            const author      = field('Autor \\/ Autorin');
            const tagsRaw     = field('Kategorien');

            if (!title || !/^https?:\/\//.test(url)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: context.payload.issue.number,
                body: 'Es fehlt ein Titel oder eine gültige URL (`http://` oder `https://`). Bitte das Issue entsprechend bearbeiten — der PR wird dann automatisch erstellt.',
              });
              core.setFailed('Missing title or valid URL in submission.');
              return;
            }

            // Map German audience labels to schema values
            const audienceRaw = field('Zielgruppe');
            const audienceMap = {
              'Student*innen':     'students',
              'Mitarbeiter*innen': 'staff',
              'Beide':             'both',
            };
            const audience = audienceMap[audienceRaw] ?? 'both';

            // Map Ja/Nein to boolean
            const internal = field('Nur im HSBI-Netz erreichbar\\?') === 'Ja' ? 'true' : 'false';

            const tags = tagsRaw
              .split(',')
              .map(t => t.trim())
              .filter(Boolean)
              .map(yaml)
              .join(', ');

            const today = new Date().toISOString().split('T')[0];

            // Build a safe filename from the title
            const slug = title
              .toLowerCase()
              .replace(/[^a-z0-9]+/g, '-')
              .replace(/^-|-$/g, '') || `tool-${context.payload.issue.number}`;

            const frontmatter = [
              '---',
              `title: ${yaml(title)}`,
              `url: ${yaml(url)}`,
              `description: ${yaml(description)}`,
              `author: ${yaml(author)}`,
              `status: "down"`,
              `tags: [${tags}]`,
              `audience: "${audience}"`,
              `internal: ${internal}`,
              `addedAt: "${today}"`,
              '---',
              '',
            ].join('\n');

            core.setOutput('slug', slug);
            core.setOutput('frontmatter', frontmatter);
            core.setOutput('branch', `tool-submission/${slug}-${context.payload.issue.number}`);

      - name: Create branch and file
        env:
          SLUG: ${{ steps.parse.outputs.slug }}
          BRANCH: ${{ steps.parse.outputs.branch }}
          FRONTMATTER: ${{ steps.parse.outputs.frontmatter }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          printf '%s' "$FRONTMATTER" > "src/content/tools/${SLUG}.md"
          git add "src/content/tools/${SLUG}.md"
          # On an edited issue the content may be unchanged — push anyway so the
          # existing branch (and its PR) stays in sync.
          if git diff --cached --quiet; then
            echo "No content change."
          else
            git commit -m "feat: add tool submission '${SLUG}' (issue #${{ github.event.issue.number }})"
          fi
          git push --force origin "$BRANCH"

      - name: Open pull request
        uses: actions/github-script@v7
        with:
          script: |
            const issue  = context.payload.issue;
            const branch = '${{ steps.parse.outputs.branch }}';

            // An edited issue re-runs this job; the branch push already updated
            // any open PR, so only create one when none exists yet.
            const { data: open } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              head:  `${context.repo.owner}:${branch}`,
              state: 'open',
            });

            if (open.length > 0) {
              core.info(`PR already open: ${open[0].html_url}`);
              return;
            }

            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `[Tool] ${issue.title.replace(/^\[Tool\]\s*/, '')}`,
              head:  branch,
              base:  'main',
              body:  `Automatisch generierter PR aus Issue #${issue.number}.\n\nBitte Inhalt prüfen, dann mergen.\n\nCloses #${issue.number}`,
              draft: true,
            });

            await github.rest.issues.createComment({
              owner:      context.repo.owner,
              repo:       context.repo.repo,
              issue_number: issue.number,
              body: `Danke! Ein Draft-PR wurde automatisch erstellt: ${pr.html_url}\n\nEin Admin wird ihn prüfen und mergen. Screenshot und Erreichbarkeits-Status werden nach dem Merge automatisch ergänzt.`,
            });
