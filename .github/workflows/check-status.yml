name: Check tool status

on:
  schedule:
    - cron: '0 8 * * 1,4' # Monday and Thursday at 08:00 UTC
  push:
    branches:
      - prod
  workflow_dispatch:

jobs:
  check-status:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check tool availability
        run: node scripts/check-status.mjs

      - name: Commit status update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/status.json
          git diff --cached --quiet || git commit -m "chore: update tool status"
          git push
